name: Build MonBall

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # Server 端：Linux musl 静态编译
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Inject version into source files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" server/Cargo.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: server-${{ runner.os }}-cargo-

      - name: Build server (musl static)
        working-directory: server
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: sysmon-agent-linux-x86_64
          path: server/target/x86_64-unknown-linux-musl/release/sysmon-agent

  # Client 端：Windows Tauri 打包
  build-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Inject version into source files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          # Update tauri.conf.json (simple regex replace to preserve file structure)
          $conf = Get-Content "client/src-tauri/tauri.conf.json" -Raw
          $conf = $conf -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content "client/src-tauri/tauri.conf.json" $conf -NoNewline
          # Update Cargo.toml (only first occurrence in [package] section)
          $lines = Get-Content "client/src-tauri/Cargo.toml"
          $replaced = $false
          $newLines = $lines | ForEach-Object {
            if (-not $replaced -and $_ -match '^version = "') {
              $replaced = $true
              "version = `"$version`""
            } else { $_ }
          }
          Set-Content "client/src-tauri/Cargo.toml" $newLines

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/src-tauri/target
          key: client-${{ runner.os }}-cargo-${{ hashFiles('client/src-tauri/Cargo.lock') }}
          restore-keys: client-${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Clean old bundle artifacts
        shell: pwsh
        run: |
          $bundlePath = "client/src-tauri/target/release/bundle"
          if (Test-Path $bundlePath) { Remove-Item -Recurse -Force $bundlePath }

      - name: Build Tauri app
        working-directory: client
        run: npx tauri build

      - name: Upload client installer
        uses: actions/upload-artifact@v4
        with:
          name: monball-client-windows
          path: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe

  # 发布 Release（仅在 tag 推送时）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sysmon-agent-linux-x86_64/sysmon-agent
            monball-client-windows/**/*
          generate_release_notes: true
