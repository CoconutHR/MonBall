<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MonBall 配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 24px;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 600;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .item-row label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
        }
        .item-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 10px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f0f1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #4a9eff;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        #save-btn {
            background: #4a9eff;
            color: #fff;
        }
        #save-btn:hover {
            background: #3a8eef;
        }
        #cancel-btn {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        #cancel-btn:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <h2>MonBall 配置</h2>

    <div class="section">
        <div class="section-title">显示指标</div>
        <div id="item-list"></div>
    </div>

    <div class="section">
        <div class="section-title">服务器连接</div>
        <div class="form-group">
            <label>IP 地址</label>
            <input type="text" id="server-ip" placeholder="127.0.0.1" />
        </div>
        <div class="form-group">
            <label>端口</label>
            <input type="number" id="server-port" placeholder="8080" />
        </div>
        <div class="form-group">
            <label>Token</label>
            <input type="text" id="server-token" placeholder="secret123" />
        </div>
    </div>

    <div class="btn-row">
        <button id="cancel-btn">取消</button>
        <button id="save-btn">保存</button>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { getCurrentWindow } = window.__TAURI__.window;

        const appWindow = getCurrentWindow();
        let config;

        async function loadConfig() {
            config = await invoke('read_config');
            renderItems();
            renderServer();
        }

        function renderItems() {
            const list = document.getElementById('item-list');
            list.innerHTML = '';
            config.items.forEach(function(item, i) {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = '<input type="checkbox" id="chk-' + i + '" ' + (item.show ? 'checked' : '') + ' /><label for="chk-' + i + '">' + item.label + '</label>';
                list.appendChild(row);
            });
        }

        function renderServer() {
            document.getElementById('server-ip').value = config.server.ip || '';
            document.getElementById('server-port').value = config.server.port || '';
            document.getElementById('server-token').value = config.server.token || '';
        }

        document.getElementById('save-btn').onclick = async function() {
            // 收集指标显示状态
            config.items.forEach(function(item, i) {
                const cb = document.getElementById('chk-' + i);
                if (cb) item.show = cb.checked;
            });
            // 收集服务器设置
            config.server.ip = document.getElementById('server-ip').value.trim() || '127.0.0.1';
            config.server.port = parseInt(document.getElementById('server-port').value) || 8080;
            config.server.token = document.getElementById('server-token').value.trim() || 'secret123';

            await invoke('save_config', { config: config });
            appWindow.hide();
        };

        document.getElementById('cancel-btn').onclick = function() {
            appWindow.hide();
        };

        loadConfig();
    </script>
</body>
</html>
