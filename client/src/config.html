<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>MonBall 配置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 24px;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #fff;
            font-weight: 600;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 12px;
        }
        .item-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin-bottom: 6px;
            gap: 10px;
        }
        .item-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .item-row .item-label {
            width: 40px;
            font-size: 14px;
            flex-shrink: 0;
        }
        .item-row input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f1a;
            color: #fff;
            font-size: 12px;
            outline: none;
            min-width: 50px;
        }
        .item-row input[type="text"]:focus {
            border-color: #4a9eff;
        }
        .item-row .item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .item-row input[type="number"] {
            width: 50px;
            padding: 4px 6px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #0f0f1a;
            color: #fff;
            font-size: 12px;
            text-align: center;
            outline: none;
        }
        .item-row input[type="number"]:focus {
            border-color: #4a9eff;
        }
        .item-row input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid #444;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            padding: 2px;
        }
        .item-row .ctrl-label {
            font-size: 11px;
            color: #777;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0f0f1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #4a9eff;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        #save-btn {
            background: #4a9eff;
            color: #fff;
        }
        #save-btn:hover {
            background: #3a8eef;
        }
        #cancel-btn {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        #cancel-btn:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <h2>MonBall 配置</h2>

    <div class="section">
        <div class="section-title">显示指标（勾选启用 / 字号 / 颜色）</div>
        <div id="item-list"></div>
    </div>

    <div class="section">
        <div class="section-title">悬浮窗背景透明度</div>
        <div class="form-group">
            <label>透明度: <span id="opacity-val">65%</span></label>
            <input type="range" id="opacity-slider" min="10" max="100" value="65" style="width:100%;cursor:pointer;" />
        </div>
    </div>

    <div class="section">
        <div class="section-title">服务器连接</div>
        <div class="form-group">
            <label>IP 地址</label>
            <input type="text" id="server-ip" placeholder="127.0.0.1" />
        </div>
        <div class="form-group">
            <label>端口</label>
            <input type="number" id="server-port" placeholder="26666" />
        </div>
        <div class="form-group">
            <label>Token</label>
            <input type="text" id="server-token" placeholder="monball" />
        </div>
    </div>

    <div class="btn-row">
        <button id="cancel-btn">取消</button>
        <button id="save-btn">保存</button>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { emit } = window.__TAURI__.event;
        const { getCurrentWindow } = window.__TAURI__.window;

        const appWindow = getCurrentWindow();
        let config;

        async function loadConfig() {
            config = await invoke('read_config');
            renderItems();
            renderServer();
        }

        function renderItems() {
            const list = document.getElementById('item-list');
            list.innerHTML = '';
            config.items.forEach(function(item, i) {
                const row = document.createElement('div');
                row.className = 'item-row';

                const fontSize = item.fontSize || 13;
                const color = item.color || '#ffffff';

                row.innerHTML =
                    '<input type="checkbox" id="chk-' + i + '" ' + (item.show ? 'checked' : '') + ' />' +
                    '<span class="item-label">' + item.label + '</span>' +
                    '<input type="text" id="dl-' + i + '" value="' + (item.displayLabel || '') + '" placeholder="' + item.label + '" title="悬浮窗显示名" />' +
                    '<div class="item-controls">' +
                        '<span class="ctrl-label">字号</span>' +
                        '<input type="number" id="fs-' + i + '" min="9" max="24" value="' + fontSize + '" />' +
                        '<span class="ctrl-label">颜色</span>' +
                        '<input type="color" id="clr-' + i + '" value="' + color + '" />' +
                    '</div>';
                list.appendChild(row);
            });
        }

        function renderServer() {
            document.getElementById('server-ip').value = config.server.ip || '';
            document.getElementById('server-port').value = config.server.port || '';
            document.getElementById('server-token').value = config.server.token || '';
            // 透明度
            const opacityPct = Math.round((config.opacity || 0.65) * 100);
            document.getElementById('opacity-slider').value = opacityPct;
            document.getElementById('opacity-val').textContent = opacityPct + '%';
        }

        document.getElementById('opacity-slider').addEventListener('input', function(e) {
            document.getElementById('opacity-val').textContent = e.target.value + '%';
        });

        document.getElementById('save-btn').onclick = async function() {
            // 收集指标显示状态 + 字体大小 + 颜色
            config.items.forEach(function(item, i) {
                const cb = document.getElementById('chk-' + i);
                const fs = document.getElementById('fs-' + i);
                const clr = document.getElementById('clr-' + i);
                const dl = document.getElementById('dl-' + i);
                if (cb) item.show = cb.checked;
                if (fs) item.fontSize = parseInt(fs.value) || 13;
                if (clr) item.color = clr.value;
                if (dl) item.displayLabel = dl.value.trim();
            });
            // 收集服务器设置
            config.server.ip = document.getElementById('server-ip').value.trim() || '127.0.0.1';
            config.server.port = parseInt(document.getElementById('server-port').value) || 26666;
            config.server.token = document.getElementById('server-token').value.trim() || 'monball';
            // 收集透明度
            config.opacity = parseInt(document.getElementById('opacity-slider').value) / 100;

            await invoke('save_config', { config: config });
            // 通知 overlay 窗口刷新配置
            await emit('config-updated');
            appWindow.hide();
        };

        document.getElementById('cancel-btn').onclick = function() {
            appWindow.hide();
        };

        loadConfig();
    </script>
</body>
</html>
