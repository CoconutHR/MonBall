<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', 'Consolas', monospace;
            color: #fff;
            user-select: none;
        }
        #container {
            display: flex;
            flex-direction: column;
            padding: 12px 14px;
            background: rgba(15, 15, 20, 0.65);
            border: none;
            outline: none;
            border-radius: 0;
            width: 100%;
            height: 100%;
            gap: 6px;
            cursor: default;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            line-height: 1.5;
            padding: 2px 0;
        }
        .stat-label {
            opacity: 0.7;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .stat-value {
            font-weight: 600;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .error-msg {
            font-size: 11px;
            color: #ff6b6b;
            text-align: center;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="error-msg" id="error" style="display:none;"></div>
    </div>

    <script>
        // Tauri v2 全局 API（withGlobalTauri: true）
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;
        const { getCurrentWindow } = window.__TAURI__.window;

        const appWindow = getCurrentWindow();

        let config = {
            items: [],
            server: { ip: '127.0.0.1', port: 26666, token: 'monball' },
            opacity: 0.65,
            window: { x: null, y: null }
        };

        const container = document.getElementById('container');
        const errorEl = document.getElementById('error');

        // 加载配置
        async function loadConfig() {
            try {
                config = await invoke('read_config');
                // 确保 window 字段存在
                if (!config.window) config.window = { x: null, y: null };
            } catch (e) {
                console.warn('加载配置失败，使用默认值:', e);
            }
            applyOpacity(config.opacity || 0.65);
            render();
            // 恢复窗口位置
            restoreWindowPosition();
        }

        // 恢复窗口上次位置
        async function restoreWindowPosition() {
            if (config.window && config.window.x != null && config.window.y != null) {
                try {
                    await appWindow.setPosition(new window.__TAURI__.window.PhysicalPosition(
                        config.window.x, config.window.y
                    ));
                } catch (e) {
                    console.warn('恢复窗口位置失败:', e);
                }
            }
        }

        // 保存窗口位置（防抖）
        let savePositionTimer = null;
        async function saveWindowPosition() {
            try {
                const pos = await appWindow.outerPosition();
                config.window = { x: pos.x, y: pos.y };
                // 防抖：500ms 内多次移动只保存最后一次
                if (savePositionTimer) clearTimeout(savePositionTimer);
                savePositionTimer = setTimeout(function() {
                    invoke('save_config', { config: config }).catch(function() {});
                }, 500);
            } catch (e) {
                // ignore
            }
        }

        // 监听窗口移动事件
        listen('tauri://move', function() {
            saveWindowPosition();
        });

        // 透明度控制 —— 仅作用于背景，不影响文本
        function applyOpacity(val) {
            val = Math.max(0.1, Math.min(1.0, val));
            config.opacity = val;
            container.style.background = 'rgba(15, 15, 20, ' + val + ')';
        }

        // 监听来自 Rust 端的透明度调节事件
        listen('adjust-opacity', function(event) {
            applyOpacity((config.opacity || 0.65) + event.payload);
            // 持久化到配置文件
            invoke('save_config', { config: config }).catch(function() {});
        });

        // 监听配置更新事件（配置页面保存后通知 overlay 刷新）
        listen('config-updated', function() {
            invoke('read_config').then(function(newConfig) {
                config = newConfig;
                if (!config.window) config.window = { x: null, y: null };
                applyOpacity(config.opacity || 0.65);
                render();
            }).catch(function() {});
        });

        // 根据配置渲染指标行（支持每项自定义字体大小和颜色）
        function render() {
            // 清除旧指标行，保留 error 元素
            const rows = container.querySelectorAll('.stat-row');
            rows.forEach(r => r.remove());

            config.items.filter(i => i.show).forEach(item => {
                const row = document.createElement('div');
                row.className = 'stat-row';

                const fontSize = (item.fontSize || 13) + 'px';
                const color = item.color || '#ffffff';

                const displayLabel = item.displayLabel || item.label;

                row.innerHTML =
                    '<span class="stat-label" style="font-size:' + (Math.max(9, (item.fontSize || 13) - 2)) + 'px; color:' + color + ';">' + displayLabel + '</span>' +
                    '<span class="stat-value" id="val-' + item.id + '" style="font-size:' + fontSize + '; color:' + color + ';">' + '--' + '</span>';
                container.appendChild(row);
            });
        }

        // 更新数值（保持颜色不变，只更新文本内容）
        function updateStats(stats) {
            const fmtTemp = function(v) { return v != null ? v.toFixed(0) + '°C' : 'N/A'; };
            const map = {
                cpu: stats.cpu_usage.toFixed(1) + '%',
                mem: stats.mem_usage.toFixed(1) + '%',
                disk: stats.disk_usage.toFixed(1) + '%',
                net: formatNet(stats.net_rx_rate, stats.net_tx_rate),
                cpu_temp: fmtTemp(stats.cpu_temp),
                acpi_temp: fmtTemp(stats.acpi_temp),
                wifi_temp: fmtTemp(stats.wifi_temp)
            };
            config.items.filter(i => i.show).forEach(item => {
                const el = document.getElementById('val-' + item.id);
                if (el) el.textContent = map[item.id] || '--';
            });
            errorEl.style.display = 'none';
        }

        function formatNet(rx, tx) {
            const fmt = function(v) {
                if (v >= 1048576) return (v / 1048576).toFixed(1) + ' M/s';
                if (v >= 1024) return (v / 1024).toFixed(1) + ' K/s';
                return v + ' B/s';
            };
            return '\u2193' + fmt(rx) + ' \u2191' + fmt(tx);
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }

        // 轮询获取数据
        let pollTimer;
        async function startPolling() {
            const poll = async function() {
                try {
                    const stats = await invoke('fetch_stats', {
                        ip: config.server.ip,
                        port: config.server.port,
                        token: config.server.token
                    });
                    updateStats(stats);
                } catch (e) {
                    showError('连接失败');
                }
            };
            await poll();
            pollTimer = setInterval(poll, 1000);
        }

        // 拖动控制：mousedown 启动拖动
        document.body.addEventListener('mousedown', function(e) {
            if (e.buttons === 1) {
                appWindow.startDragging();
            }
        });

        // 启动
        loadConfig().then(startPolling);

        // 清理
        window.addEventListener('beforeunload', function() {
            clearInterval(pollTimer);
        });
    </script>
</body>
</html>
